      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"></stop>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
