  <ellipse class="shadow" cx="262" cy="418" rx="96" ry="17" fill="#000000" opacity="0"></ellipse>

  <g class="char">
    <ellipse cx="262" cy="418" rx="96" ry="17" fill="url(#holeGrad)"></ellipse>
    <g class="boneco">
