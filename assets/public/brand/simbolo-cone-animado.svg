      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"></stop>
    </linearGradient>
    <radialGradient id="holeGrad" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#050608"></stop>
      <stop offset="0.7" stop-color="#0b0d12"></stop>
      <stop offset="1" stop-color="#181b22"></stop>
    </radialGradient>
